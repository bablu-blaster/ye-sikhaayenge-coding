<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
   
   <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:title" content="Academic Portal">
    <meta property="og:description" content="Unified access for faculty and students. Manage attendance, marks, and academic records seamlessly.">
    <meta property="og:image" content="https://avatars.githubusercontent.com/u/177772946?v=4">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="1200">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://avatars.githubusercontent.com/u/177772946?v=4">

    <title>Academic Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --surface: #1c1c1e;
            --surface-hover: #2c2c2e;
            --text-main: #ffffff;
            --text-muted: #98989d;
            --accent: #0a84ff;
            --accent-bg: #ffffff;
            --accent-text: #000000;
            --error: #ff453a;
            --radius: 16px;
            --font: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
            --transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: var(--font); background-color: var(--bg); color: var(--text-main);
            min-height: 100svh; display: flex; flex-direction: column;
            padding: 0; overflow-x: hidden; -webkit-font-smoothing: antialiased;
        }

        .ambient-glow { display: none; }

        .glass-card {
            width: 100%; max-width: 440px; margin: 0 auto;
            padding: 4rem 1.5rem; background: transparent; border: none; box-shadow: none;
            opacity: 0; transform: translateY(20px);
            animation: fadeUp 0.6s forwards cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .login-container { margin: auto; min-height: 100svh; display: flex; flex-direction: column; justify-content: center; }
        .dashboard-container { margin: 0 auto auto; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dashboard-container.glass-card { max-width: 800px; padding: 4rem 1.5rem; }

        .hidden { display: none !important; }

        h1.main-title { font-size: 2.2rem; font-weight: 700; letter-spacing: -0.04em; margin-bottom: 0.5rem; text-align: center; }
        p.subtitle { color: var(--text-muted); font-size: 1.05rem; text-align: center; margin-bottom: 3rem; }

        .toggle-container { margin-bottom: 2rem; }
        .toggle-label { display: none; }
        .toggle-switch-wrapper {
            display: flex; background: var(--surface); border-radius: 100px; padding: 4px; position: relative;
        }
        .toggle-option {
            flex: 1; padding: 0.75rem; border: none; background: transparent;
            color: var(--text-muted); font-size: 0.9rem; font-weight: 500; cursor: pointer;
            z-index: 2; position: relative; transition: var(--transition);
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
        }
        .toggle-option.active { color: #ffffff; font-weight: 600; }
        .toggle-option svg { width: 16px; height: 16px; }
        .toggle-slider {
            position: absolute; top: 4px; left: 4px; width: calc(50% - 4px); height: calc(100% - 8px);
            background: #636366; border-radius: 100px; z-index: 1;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .toggle-slider.faculty { transform: translateX(calc(100% + 0px)); }

        .input-group { position: relative; margin-bottom: 1rem; width: 100%; }
        
        .md-input, .md-select-trigger {
            width: 100%; background: var(--surface); border: none;
            border-radius: var(--radius); padding: 1.8rem 1.2rem 0.6rem; color: var(--text-main);
            font-size: 1.05rem; font-family: inherit; font-weight: 500; outline: none;
            transition: var(--transition); appearance: none; min-height: 3.8rem;
        }
        .md-input:focus, .md-select-wrapper.open .md-select-trigger, .combobox-wrapper.open .md-input {
            background: var(--surface-hover);
        }
        
        .input-label {
            position: absolute; left: 1.2rem; top: 1.2rem; color: var(--text-muted);
            font-size: 1rem; pointer-events: none; transition: var(--transition); z-index: 5;
        }
        
        .md-input:focus + .input-label, 
        .md-input:not(:placeholder-shown) + .input-label,
        .md-select-wrapper.selected .input-label, 
        .md-select-wrapper.open .input-label,
        .combobox-wrapper:focus-within .input-label {
            top: 0.5rem; font-size: 0.75rem; color: var(--text-muted); font-weight: 500;
        }
        .input-group > .input-label { top: 1.2rem; left: 1.2rem; z-index: 5; }
        .combobox-wrapper:focus-within ~ .input-label,
        .combobox-wrapper .md-input:not(:placeholder-shown) ~ .input-label,
        .input-group:focus-within > .input-label,
        .input-group .md-input:not(:placeholder-shown) ~ .input-label { 
            top: 0.5rem; font-size: 0.75rem; color: var(--text-muted); font-weight: 500;
        }
        
        .md-input::placeholder { color: transparent; }
        .validation-message { 
            color: var(--error); font-size: 0.85rem; font-weight: 500;
            padding: 0.5rem 0.8rem 0; display: none;
        }
        .validation-message:not(:empty) { display: block; animation: fadeDown 0.3s ease; }
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .md-select-wrapper, .combobox-wrapper { position: relative; width: 100%; }
        .md-select-trigger { cursor: pointer; display: flex; align-items: center; justify-content: flex-start; }
        .md-select-trigger::after {
            content: ''; width: 8px; height: 8px; border-right: 2.5px solid var(--text-muted);
            border-bottom: 2.5px solid var(--text-muted); transform: translateY(-50%) rotate(45deg);
            transition: var(--transition); position: absolute; right: 1.5rem; top: 50%;
        }
        .md-select-wrapper.open .md-select-trigger::after { transform: translateY(-50%) rotate(-135deg); }
        
        .md-select-options, .combobox-options {
            position: absolute; top: calc(100% + 8px); left: 0; right: 0;
            background: #2c2c2e; border: none;
            border-radius: 16px; max-height: 220px; overflow-y: auto; z-index: 100;
            opacity: 0; transform: translateY(-10px); visibility: hidden; transition: var(--transition);
            padding: 0.5rem; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .md-select-wrapper.open .md-select-options, .combobox-wrapper.open .combobox-options {
            opacity: 1; transform: translateY(0); visibility: visible;
        }
        .md-select-option, .combobox-option {
            padding: 0.8rem 1rem; font-size: 1rem; font-weight: 500; border-radius: 12px; cursor: pointer; transition: background 0.2s;
        }
        .md-select-option:hover, .combobox-option:hover { background: #3a3a3c; }
        .native-select { display: none; }

        .md-filled-button {
            width: 100%; background: var(--accent-bg); color: var(--accent-text); border: none;
            padding: 1.2rem; border-radius: 16px; font-size: 1.1rem; font-weight: 600;
            cursor: pointer; transition: var(--transition); display: flex; align-items: center;
            justify-content: center; margin-top: 2.5rem;
        }
        .md-filled-button:hover { opacity: 0.9; transform: scale(0.98); }
        .md-filled-button:active { opacity: 0.7; transform: scale(0.96); }
        .md-filled-button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .md-text-button {
            background: transparent; border: none; color: var(--accent); font-size: 0.95rem; font-weight: 500;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem;
            width: 100%; padding: 1rem; transition: opacity 0.2s;
        }
        .md-text-button:hover { opacity: 0.8; }
        .md-text-button.cancel-btn { color: var(--error); }
        .md-text-button svg { width: 18px; height: 18px; }

        .student-fields, .faculty-fields { display: none; }
        .student-fields.show, .faculty-fields.show { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        @media (max-width: 480px) { .form-row { grid-template-columns: 1fr; gap: 0; } }

        .manual-entry-section {
            background: var(--surface); border-radius: 20px; padding: 1.5rem;
            margin-top: 1rem;
        }
        .section-divider {
            height: 1px; background: rgba(255,255,255,0.1); margin: 1.5rem 0 2rem; position: relative;
            display: flex; align-items: center; justify-content: center;
        }
        .section-divider span {
            background: var(--surface); padding: 0 1rem; font-size: 0.8rem; color: var(--text-muted);
            text-transform: uppercase; font-weight: 600; letter-spacing: 0.05em;
        }

        .saved-courses-section { margin-bottom: 1.5rem; }
        .saved-courses-title { font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
        .saved-courses-title svg { width: 16px; height: 16px; }
        .saved-course-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 1rem 1.2rem; background: var(--surface); border-radius: 16px; margin-bottom: 0.5rem; cursor: pointer; transition: var(--transition);
        }
        .saved-course-item:hover, .saved-course-item.selected { background: var(--surface-hover); }
        .saved-course-info { flex: 1; }
        .saved-course-name { font-size: 1rem; font-weight: 600; margin-bottom: 0.2rem; color: var(--text-main); }
        .saved-course-details { font-size: 0.85rem; color: var(--text-muted); }
        .delete-course-btn {
            background: transparent; border: none; color: var(--error); cursor: pointer;
            width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            opacity: 0.8; transition: var(--transition); flex-shrink: 0; margin-left: 0.5rem;
        }
        .delete-course-btn svg { width: 22px; height: 22px; }
        .delete-course-btn:hover { opacity: 1; background: rgba(255, 69, 58, 0.1); transform: scale(1.05); }

        .dashboard-header {
            display: flex; flex-direction: column; align-items: center; text-align: center;
            margin-bottom: 3rem; padding-bottom: 0; border-bottom: none;
        }
        .user-section { display: flex; flex-direction: column; align-items: center; gap: 1.2rem; margin-bottom: 1.5rem; width: 100%; }
        .user-details h2 { font-size: 2.2rem; font-weight: 700; letter-spacing: -0.04em; margin-bottom: 0.3rem; }
        .user-info-split { display: flex; flex-direction: column; gap: 0.2rem; }
        .info-primary { font-size: 1.05rem; font-weight: 500; color: var(--text-muted); }
        .info-secondary { font-size: 0.95rem; color: var(--text-muted); }
        
        .sign-out-btn {
            background: rgba(255, 69, 58, 0.1); border: none; color: var(--error);
            padding: 0.8rem 2rem; border-radius: 100px; font-size: 0.95rem; font-weight: 600;
            cursor: pointer; transition: var(--transition); display: inline-block;
        }
        .sign-out-btn:hover { background: rgba(255, 69, 58, 0.2); transform: scale(0.96); }

        .section-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem; letter-spacing: -0.02em; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1rem; }
        .menu-card {
            background: var(--surface); border-radius: 20px; padding: 1.5rem; cursor: pointer; transition: var(--transition);
            display: flex; align-items: center; gap: 1.25rem; border: none; box-shadow: none;
        }
        .menu-card:hover { transform: scale(0.98); background: var(--surface-hover); }
        .menu-icon {
            width: 52px; height: 52px; border-radius: 14px; background: #2c2c2e;
            display: flex; align-items: center; justify-content: center; color: var(--accent); flex-shrink: 0;
        }
        .menu-icon svg { width: 24px; height: 24px; }
        .menu-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.2rem; }
        .menu-desc { font-size: 0.9rem; color: var(--text-muted); line-height: 1.3; }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
            opacity: 0; visibility: hidden; transition: var(--transition);
        }
        .modal-overlay.visible { opacity: 1; visibility: visible; }
        .modal-content {
            background: #1c1c1e; border: none; border-radius: 24px;
            padding: 2.5rem; width: 90%; max-width: 380px; text-align: center;
            transform: scale(0.95); transition: var(--transition);
        }
        .modal-overlay.visible .modal-content { transform: scale(1); }
        .modal-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 2rem; }
        .semester-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 2rem; }
        .semester-button {
            aspect-ratio: 1; border-radius: 50%; border: none; background: #2c2c2e;
            color: var(--text-main); font-size: 1.2rem; font-weight: 600; cursor: pointer; transition: var(--transition);
            display: flex; align-items: center; justify-content: center;
        }
        .semester-button:hover { background: #3a3a3c; }
        .modal-close-btn {
            background: transparent; border: none; color: var(--accent); font-size: 1.05rem; font-weight: 600;
            cursor: pointer; transition: opacity 0.2s;
        }
        .modal-close-btn:hover { opacity: 0.8; }
        
        .alert-dialog { padding: 0; max-width: 320px; text-align: center; overflow: hidden; background: #1c1c1e; }
        .alert-dialog .modal-title { font-size: 1.15rem; font-weight: 600; padding: 1.5rem 1rem 0.5rem; margin: 0; }
        .alert-message { font-size: 0.9rem; color: var(--text-muted); padding: 0 1.5rem 1.5rem; line-height: 1.4; }
        .alert-actions { display: flex; border-top: 1px solid rgba(255,255,255,0.1); }
        .alert-btn {
            flex: 1; padding: 1rem; background: transparent; border: none; font-size: 1.05rem; font-weight: 500;
            color: var(--accent); cursor: pointer; transition: background 0.2s;
        }
        .alert-btn:hover { background: rgba(255,255,255,0.05); }
        .alert-btn.cancel { border-right: 1px solid rgba(255,255,255,0.1); font-weight: 400; color: var(--text-main); }
        .alert-btn.confirm { color: var(--error); font-weight: 600; }

        .snackbar-container { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); z-index: 2000; display: flex; flex-direction: column; gap: 0.5rem; }
        .snackbar {
            background: #2c2c2e; color: #ffffff; padding: 1rem 1.5rem; border-radius: 100px;
            font-size: 0.95rem; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: snackIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes snackIn { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }

        .loading-spinner { width: 20px; height: 20px; border: 3px solid rgba(0,0,0,0.2); border-right-color: #000; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            body { align-items: flex-start; }
            .glass-card { padding: 3rem 1.5rem; }
            .menu-grid { grid-template-columns: 1fr; gap: 1rem; }
            .sign-out-btn { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>

    <!-- Hidden top nav elements to keep JS happy -->
    <div id="topNavbar" class="hidden"><div id="topNavAvatar"></div><div id="topNavUserInfo"></div></div>

    <div id="loginContainer" class="login-container glass-card">
        <h1 class="main-title">Academic Portal</h1>
        <p class="subtitle">Unified access for faculty and students</p>

        <form id="loginForm" class="login-form" novalidate>
            <div class="toggle-container">
                <div class="toggle-switch-wrapper">
                    <button type="button" class="toggle-option active" data-value="student">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20v2H6.5A2.5 2.5 0 0 1 4 19.5v0Z"/>
                            <path d="M15 2v10.54a2.5 2.5 0 1 1-4 0V2"/>
                        </svg>
                        Student
                    </button>
                    <button type="button" class="toggle-option" data-value="faculty">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2v6h6"/><path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6Z"/>
                            <path d="M8 12h2"/><path d="M8 16h8"/><path d="M12 12h4"/>
                        </svg>
                        Faculty
                    </button>
                    <div class="toggle-slider"></div>
                </div>
            </div>

            <div id="studentFields" class="student-fields show">
                <div class="form-row">
                    <div class="input-group">
                        <select id="year" class="native-select" required>
                            <option value="" disabled selected></option>
                            <option value="2022">2022</option>
                            <option value="2023">2023</option>
                            <option value="2024">2024</option>
                            <option value="2025">2025</option>
                        </select>
                        <label for="year" class="input-label">Academic Year</label>
                        <div id="yearError" class="validation-message"></div>
                    </div>
                    <div class="input-group">
                        <input type="tel" id="studentPhoneNumber" class="md-input" placeholder=" " required pattern="\d{10}">
                        <label for="studentPhoneNumber" class="input-label">Phone Number</label>
                        <div id="studentPhoneError" class="validation-message"></div>
                    </div>
                </div>
            </div>

            <div id="facultyFields" class="faculty-fields">
                <div id="savedCoursesContainer"></div>
                
                <div class="input-group" style="margin-bottom: 0.5rem;">
                    <div class="combobox-wrapper">
                        <input type="text" id="courseSearch" class="md-input" placeholder=" " autocomplete="off">
                        <label for="courseSearch" class="input-label">Select Course</label>
                        <div class="combobox-options"></div>
                        <input type="hidden" id="course" name="course" required>
                    </div>
                    <div id="courseError" class="validation-message"></div>
                </div>
                
                <button type="button" id="toggleManualEntryBtn" class="md-text-button">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Add New Course
                </button>
                
                <div id="manualEntrySection" class="manual-entry-section hidden">
                    <div class="section-divider"><span>New Course</span></div>
                    
                    <div class="form-row">
                        <div class="input-group">
                            <input type="text" id="manualFacultyName" class="md-input" placeholder=" " autocomplete="off">
                            <label for="manualFacultyName" class="input-label">Faculty Name</label>
                        </div>
                        <div class="input-group">
                            <input type="text" id="manualCourseCode" class="md-input" placeholder=" " autocomplete="off">
                            <label for="manualCourseCode" class="input-label">Course Code</label>
                        </div>
                    </div>
                    
                    <div class="input-group">
                        <input type="text" id="manualCourseName" class="md-input" placeholder=" " autocomplete="off">
                        <label for="manualCourseName" class="input-label">Course Name</label>
                    </div>
                    
                    <div class="form-row">
                        <div class="input-group">
                            <select id="manualSemester" class="native-select">
                                <option value="" disabled selected></option>
                                <option value="1">Sem 1</option><option value="2">Sem 2</option>
                                <option value="3">Sem 3</option><option value="4">Sem 4</option>
                                <option value="5">Sem 5</option><option value="6">Sem 6</option>
                            </select>
                            <label for="manualSemester" class="input-label">Semester</label>
                        </div>
                        <div class="input-group">
                            <select id="manualYear" class="native-select">
                                <option value="" disabled selected></option>
                                <option value="2022">2022</option><option value="2023">2023</option>
                                <option value="2024">2024</option><option value="2025">2025</option>
                                <option value="2026">2026</option>
                            </select>
                            <label for="manualYear" class="input-label">Year</label>
                        </div>
                    </div>
                    
                    <button type="button" id="cancelManualEntryBtn" class="md-text-button cancel-btn">Cancel</button>
                </div>
            </div>

            <button type="submit" class="md-filled-button" id="loginBtn">Access Portal</button>
        </form>
    </div>

    <div id="dashboardContainer" class="dashboard-container glass-card hidden">
        <div id="dashboardHeader" class="dashboard-header">
            <div class="user-section">
                <div class="user-details">
                    <h2 id="welcomeMessage">Welcome back!</h2>
                    <div class="user-info" id="userInfoDisplay"></div>
                </div>
            </div>
            <button class="sign-out-btn" onclick="signOut()">Sign Out</button>
        </div>

        <div class="menu-section">
            <h3 class="section-title" id="sectionTitle">Services</h3>
            <div class="menu-grid" id="menuGrid"></div>
        </div>
    </div>

    <div id="snackbar-container" class="snackbar-container"></div>

    <div id="semesterModal" class="modal-overlay">
        <div class="modal-content">
            <h2 class="modal-title">Select Semester</h2>
            <div class="semester-grid">
                <button class="semester-button" data-sem="1">1</button>
                <button class="semester-button" data-sem="2">2</button>
                <button class="semester-button" data-sem="3">3</button>
                <button class="semester-button" data-sem="4">4</button>
                <button class="semester-button" data-sem="5">5</button>
                <button class="semester-button" data-sem="6">6</button>
            </div>
            <button id="modalCloseBtn" class="modal-close-btn">Cancel</button>
        </div>
    </div>

    <div id="alertDialog" class="modal-overlay">
        <div class="modal-content alert-dialog">
            <h2 class="modal-title" id="alertTitle">Are you sure?</h2>

        function createCustomSelect(selectElement) {
            const wrapper = document.createElement('div');
            wrapper.className = 'md-select-wrapper';
            selectElement.parentNode.insertBefore(wrapper, selectElement);

            const trigger = document.createElement('div');
            trigger.className = 'md-select-trigger';

            const optionsContainer = document.createElement('div');
            optionsContainer.className = 'md-select-options';

            wrapper.appendChild(trigger);
            wrapper.appendChild(optionsContainer);
            wrapper.appendChild(selectElement);

            // Move the label inside the wrapper to apply focus styles
            const group = wrapper.closest('.input-group');
            if(group) {
                const label = group.querySelector('.input-label');
                if(label) wrapper.appendChild(label);
            }

            const updateTriggerText = () => {
                const selectedOption = selectElement.options[selectElement.selectedIndex];
                trigger.textContent = selectedOption ? selectedOption.text : '';
                wrapper.classList.toggle('selected', !!selectElement.value);
            };

            Array.from(selectElement.options).forEach((option, index) => {
                if (option.disabled) return;
                const customOption = document.createElement('div');
                customOption.className = 'md-select-option';
                customOption.textContent = option.text;
                customOption.dataset.value = option.value;

                customOption.addEventListener('click', () => {
                    selectElement.selectedIndex = index;
                    updateTriggerText();
                    selectElement.dispatchEvent(new Event('change'));
                    wrapper.classList.remove('open');
                });
                optionsContainer.appendChild(customOption);
            });

            trigger.addEventListener('click', () => wrapper.classList.toggle('open'));

            document.addEventListener('click', (e) => {
                if (!wrapper.contains(e.target)) wrapper.classList.remove('open');
            });

            selectElement.addEventListener('change', updateTriggerText);
            updateTriggerText();
            return wrapper;
        }

        function deleteCourse(courseKey) {
            try {
                const courses = getSavedCourses(); delete courses[courseKey];
                localStorage.setItem(STORAGE_KEY, JSON.stringify(courses)); return true;
            } catch { showSnackbar('Failed to delete course'); return false; }
        }

        function renderSavedCourses() {
            const container = document.getElementById('savedCoursesContainer'); container.innerHTML = '';
            const savedCourses = getSavedCourses(); const courseKeys = Object.keys(savedCourses);
            if (courseKeys.length === 0) return;

            const section = document.createElement('div'); section.className = 'saved-courses-section';
            section.innerHTML = `<div class="saved-courses-title">${icons.bookmark} Saved Courses</div>`;

            courseKeys.forEach(key => {
                const course = savedCourses[key];
                const item = document.createElement('div'); item.className = 'saved-course-item'; item.dataset.key = key;
                item.innerHTML = `
                    <div class="saved-course-info">
                        <div class="saved-course-name">${course.code} - ${course.name}</div>
                        <div class="saved-course-details">${course.coordinator} | Sem ${course.sem} | Yr ${course.year}</div>
                    </div>
                    <button class="delete-course-btn" data-key="${key}">${icons.delete}</button>
                `;
                item.querySelector('.saved-course-info').addEventListener('click', () => {
                    document.querySelectorAll('.saved-course-item').forEach(el => el.classList.remove('selected'));
                    item.classList.add('selected');
                    DOM.inputs.course.value = key;
                    DOM.inputs.courseSearch.value = `${course.code} - ${course.name} (Sem ${course.sem})`;
                    DOM.inputs.courseSearch.dispatchEvent(new Event('input'));
                    if (!manualEntrySection.classList.contains('hidden')) toggleManualEntryBtn.click();
                    showSnackbar('Course selected');
                });
                item.querySelector('.delete-course-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    showConfirmDialog(
                        'Delete Course', 
                        `Are you sure you want to delete "${course.name}"?`, 
                        'Delete', 
                        () => {
                            if (deleteCourse(key)) {
                                showSnackbar('Deleted'); renderSavedCourses(); populateFacultyCombobox();
                                if (DOM.inputs.course.value === key) { DOM.inputs.course.value = ''; DOM.inputs.courseSearch.value = ''; }
                            }
                        }
                    );
                });
                section.appendChild(item);
            });
            container.appendChild(section);
        }

        function populateFacultyCombobox() {
            courseOptionsContainer.innerHTML = '';
            const allCourses = { ...COURSE_DATA, ...getSavedCourses() };
            for (const key in allCourses) {
                const course = allCourses[key];
                const optionDiv = document.createElement('div');
                optionDiv.className = 'combobox-option';
                optionDiv.textContent = `${course.code} - ${course.name} (Sem ${course.sem})`;
                optionDiv.dataset.value = key;
                courseOptionsContainer.appendChild(optionDiv);
            }
        }

        function showDashboard() {
            DOM.loginContainer.classList.add('hidden');
            DOM.dashboardContainer.classList.remove('hidden');

            const isFaculty = currentUser.type === 'faculty';

            if (isFaculty) {
                const allCourses = { ...COURSE_DATA, ...getSavedCourses() };
                const courseInfo = allCourses[currentUser.courseCode];
                DOM.dashboard.welcome.textContent = `Welcome, ${currentUser.facultyName}`;
                DOM.dashboard.userInfo.innerHTML = `
                    <div class="user-info-split">
                        <span class="info-primary">${courseInfo.code} - ${courseInfo.name}</span>
                        <span class="info-secondary">Sem ${courseInfo.sem} | Year ${courseInfo.year}</span>
                    </div>`;
            } else {
                DOM.dashboard.welcome.textContent = 'Welcome, Student';
                DOM.dashboard.userInfo.innerHTML = `
                     <div class="user-info-split">
                        <span class="info-primary">ID: ${currentUser.phone}</span>
                        <span class="info-secondary">Year: ${currentUser.year}</span>
                    </div>`;
            }
            DOM.dashboard.sectionTitle.textContent = isFaculty ? 'Faculty Services' : 'Student Services';
            populateMenu();
        }

        function populateMenu() {
            DOM.menuGrid.innerHTML = '';
            const menuItems = currentUser.type === 'faculty' ? facultyMenuItems : studentMenuItems;
            menuItems.forEach(item => {
                const card = document.createElement('div'); card.className = 'menu-card'; card.tabIndex = 0;
                card.innerHTML = `<div class="menu-icon">${item.icon}</div><div><div class="menu-title">${item.title}</div><div class="menu-desc">${item.desc}</div></div>`;
                card.addEventListener('click', () => handleMenuClick(item));
                card.addEventListener('keydown', (e) => (e.key === 'Enter' || e.key === ' ') && handleMenuClick(item));
                DOM.menuGrid.appendChild(card);
            });
        }

        function showSnackbar(message) {
            const container = document.getElementById('snackbar-container');
            const snackbar = document.createElement('div'); snackbar.className = 'snackbar'; snackbar.textContent = message;
            container.appendChild(snackbar); setTimeout(() => snackbar.remove(), 3000);
        }

        function showConfirmDialog(title, message, confirmText, onConfirm) {
            const dialog = document.getElementById('alertDialog');
            document.getElementById('alertTitle').textContent = title;
            document.getElementById('alertMessage').textContent = message;
            const confirmBtn = document.getElementById('alertConfirmBtn');
            confirmBtn.textContent = confirmText;
            
            const closeDialog = () => dialog.classList.remove('visible');
            
            confirmBtn.onclick = () => { closeDialog(); onConfirm(); };
            document.getElementById('alertCancelBtn').onclick = closeDialog;
            
            dialog.classList.add('visible');
        }

        function handleLogin() {
            const originalText = DOM.loginBtn.textContent;
            DOM.loginBtn.innerHTML = '<span class="loading-spinner"></span>'; DOM.loginBtn.disabled = true;

            if (currentUser.type === 'faculty') {
                const courseKey = DOM.inputs.course.value;
                const isManualEntry = !courseKey && DOM.inputs.manualFacultyName.value.trim();
                let generatedKey;
                
                if (isManualEntry) {
                    const manualCourseCode = DOM.inputs.manualCourseCode.value.trim();
                    const manualSem = document.getElementById('manualSemester').value;
                    const manualYear = document.getElementById('manualYear').value;
                    generatedKey = `${manualCourseCode}_${manualSem}_${manualYear}`;
                    const courseData = {
                        code: manualCourseCode, name: DOM.inputs.manualCourseName.value.trim(),
                        coordinator: DOM.inputs.manualFacultyName.value.trim(), sem: manualSem, year: manualYear
                    };
                    saveCourse(generatedKey, courseData);
                }

                const allCourses = { ...COURSE_DATA, ...getSavedCourses() };
                currentUser = {
                    type: 'faculty', facultyName: isManualEntry ? DOM.inputs.manualFacultyName.value.trim() : allCourses[courseKey].coordinator,
                    courseCode: isManualEntry ? generatedKey : courseKey,
                    semester: isManualEntry ? document.getElementById('manualSemester').value : allCourses[courseKey].sem,
                    year: isManualEntry ? document.getElementById('manualYear').value : allCourses[courseKey].year
                };
            } else {
                currentUser = { type: 'student', phone: DOM.inputs.studentPhoneNumber.value.trim(), year: DOM.inputs.year.value };
            }

            setTimeout(() => { showDashboard(); DOM.loginBtn.innerHTML = originalText; DOM.loginBtn.disabled = false; }, 800);
        }

        function handleMenuClick(item) {
            if (item.special === 'semester_results') { DOM.semesterModal.classList.add('visible'); return; }

            let baseUrl, actionUrl;
            const shortYear = currentUser.year.toString().slice(-2);
            if (currentUser.type === 'faculty') {
                if (item.special === 'exam_duty') {
                    window.open(`http://14.139.238.230/doon23/${item.action}?fcode=${currentUser.phone}`, '_blank');
                    showSnackbar(`Opening ${item.title}...`); return;
                } else if (item.isControl) {
                    baseUrl = `http://14.139.238.230/doon${shortYear}/control/`;
                } else baseUrl = `http://14.139.238.230/doon${shortYear}/faculty/`;
            } else baseUrl = `http://14.139.238.230/doon${shortYear}/student/`;
            
            actionUrl = `${baseUrl}${item.action}`;
            const form = document.createElement('form'); form.method = item.method || 'POST';
            form.action = actionUrl; form.target = '_blank'; form.style.display = 'none';

            const fields = { user_id: currentUser.type === 'student' ? currentUser.phone : currentUser.facultyName };
            if (currentUser.type === 'faculty' && item.needsCourse) {
                const allCourses = { ...COURSE_DATA, ...getSavedCourses() };
                fields.ccode = allCourses[currentUser.courseCode].code; fields.sem = currentUser.semester;
            }
            if (item.params) Object.assign(fields, item.params);

            for (const key in fields) {
                const input = document.createElement('input'); input.type = 'hidden';
                input.name = key; input.value = fields[key]; form.appendChild(input);
            }
            document.body.appendChild(form); form.submit(); document.body.removeChild(form);
            showSnackbar(`Opening ${item.title}...`);
        }

        function signOut() {
            DOM.loginForm.reset(); courseSearchInput.value = ''; clearManualFields();
            toggleOptions.forEach(opt => opt.classList.remove('active')); toggleOptions[0].classList.add('active');
            toggleSlider.classList.remove('faculty');
            document.querySelectorAll('.native-select').forEach(sel => { sel.selectedIndex = 0; sel.dispatchEvent(new Event('change')); });
            currentUser = { type: 'student', phone: '', year: '', courseCode: '', semester: '', facultyName: '' };
            DOM.dashboardContainer.classList.add('hidden'); DOM.loginContainer.classList.remove('hidden');
            updateFormForUserType(); populateFacultyCombobox(); showSnackbar('Signed out');
        }

        function validateForm() {
            clearAllErrors(); let isValid = true;
            if (currentUser.type === 'student') {
                if (!DOM.inputs.year.value) isValid = showError('year', 'Select academic year.');
                if (!/^\d{10}$/.test(DOM.inputs.studentPhoneNumber.value)) isValid = showError('studentPhone', '10 digits required.');
            } else {
                const hasComboboxSelection = !!DOM.inputs.course.value;
                const hasManualEntry = DOM.inputs.manualFacultyName.value.trim() && DOM.inputs.manualCourseCode.value.trim() && DOM.inputs.manualCourseName.value.trim() && document.getElementById('manualSemester').value && document.getElementById('manualYear').value;
                if (!hasComboboxSelection && !hasManualEntry) isValid = showError('course', 'Select a course or fill manual fields.');
            }
            return isValid;
        }

        function showError(field, message) {
            const el = DOM.inputs[field];
            const group = el ? el.closest('.input-group') : document.getElementById(field).closest('.input-group');
            if (group) {
                const wrapper = group.querySelector('.md-select-wrapper, .combobox-wrapper');
                if (wrapper) wrapper.classList.add('invalid'); else group.querySelector('.md-input').classList.add('invalid');
            }
            DOM.errors[field].textContent = message; return false;
        }

        function clearAllErrors() {
            Object.values(DOM.errors).forEach(el => el.textContent = '');
            document.querySelectorAll('.invalid').forEach(el => el.classList.remove('invalid'));
        }

        function initialize() {
            document.querySelectorAll('.native-select').forEach(createCustomSelect);
            const currentYear = new Date().getFullYear();
            if (Array.from(DOM.inputs.year.options).some(opt => opt.value == currentYear)) {
                DOM.inputs.year.value = currentYear.toString(); DOM.inputs.year.dispatchEvent(new Event('change'));
            }
            const manualYearSelect = document.getElementById('manualYear');
            if (manualYearSelect && Array.from(manualYearSelect.options).some(opt => opt.value == currentYear)) {
                manualYearSelect.value = currentYear.toString(); manualYearSelect.dispatchEvent(new Event('change'));
            }
            currentUser.type = 'student'; updateFormForUserType(); populateFacultyCombobox();

            DOM.semesterModal.addEventListener('click', (e) => {
                if (e.target === DOM.semesterModal || e.target === DOM.modalCloseBtn) DOM.semesterModal.classList.remove('visible');
                if (e.target.classList.contains('semester-button')) {
                    handleMenuClick({ action: 'marks.php', method: 'POST', params: { sem: e.target.dataset.sem } });
                    DOM.semesterModal.classList.remove('visible');
                }
            });
        }

        document.addEventListener('DOMContentLoaded', initialize);
    </script>
</body>
</html>
